<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Scout AI Callback</title>
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --accent: #4f46e5; --border: #e2e8f0; --error: #dc2626; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1120; --card: #111827; --text: #f8fafc; --muted: #94a3b8; --accent: #22d3ee; --border: #1f2937; --error: #f87171; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: Inter, "Segoe UI", system-ui, sans-serif; }
    main { width: 100%; max-width: 640px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
    textarea { width: 100%; height: 110px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font: 13px ui-monospace, Consolas, monospace; resize: none; word-break: break-all; }
    button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    .error { color: var(--error); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Scout AI: autorización recibida</h1>
    <p id="hint">Copiá esta dirección y pegala en la consola donde corre <code>ml_oauth.py</code>. El código vence en pocos minutos.</p>
    <textarea id="url" readonly></textarea>
    <button id="copy" type="button">Copiar</button>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const box = document.getElementById("url");
    box.value = location.href;
    if (params.get("error")) {
      document.getElementById("title").textContent = "Scout AI: la autorización falló";
      document.getElementById("title").className = "error";
      document.getElementById("hint").textContent = params.get("error_description") || params.get("error");
    } else if (!params.get("code")) {
      document.getElementById("title").textContent = "Scout AI: callback OAuth";
      document.getElementById("hint").textContent = "Esta página recibe el código de autorización de Mercado Libre. No hay ningún código en la dirección.";
    }
    document.getElementById("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(box.value); } catch { box.select(); document.execCommand("copy"); }
      document.getElementById("copy").textContent = "Copiado";
    });
  </script>
</body>
</html>
